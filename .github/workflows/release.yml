# NetFreedom - open, local, reversible access to the open Internet.
# Copyright (C) 2026 Sergey (PsyGioX) <https://github.com/PsyGioX>
# Project home: https://github.com/PsyGioX/NetFreedom
#
# SPDX-License-Identifier: GPL-3.0-only
#
# Builds the Windows release from a version tag, writes SHA256SUMS.txt and attaches a signed build
# provenance attestation, so anybody can prove with `gh attestation verify` that the exe came from
# this repository. NOT RUN YET: try it with a tag such as v3.0.0-test first.
#
# Three jobs, each with only the rights it needs:
#   build    compiles and tests; the only job with a third-party action; no secrets, read-only token.
#   package  signs the exe and assembles the package; holds the signing certificate, uses only
#            actions published by GitHub itself and has a read-only token.
#   release  attests and publishes; the only job that may write to the repository; runs no build
#            tools and no third-party action (the release is created with the preinstalled `gh`).
# Every action is pinned to a commit SHA (the tag is in the comment). Update them with Dependabot
# (.github/dependabot.yml): a tag can be moved, a commit cannot.

name: release

on:
  push:
    tags: ["v*"]

# Nothing by default; every job asks for what it needs.
permissions: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # rc.exe (resource compiler) must be on PATH, otherwise the icon is not embedded
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: netfreedom-unsigned
          path: target/release/netfreedom.exe
          if-no-files-found: error
          retention-days: 1

  package:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: netfreedom-unsigned
          path: target/release

      # Authenticode signing: this is what makes the UAC prompt show "Verified publisher: PsyGioX".
      # Needs a code-signing certificate whose subject (CN) is PsyGioX, stored as repo secrets:
      #   CODESIGN_PFX_BASE64 (the .pfx, base64) and CODESIGN_PFX_PASSWORD.
      # Without the secrets this step is skipped and Windows shows "Unknown publisher".
      - name: Sign netfreedom.exe
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_B64) { Write-Host "No signing certificate configured, skipping."; exit 0 }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\codesign.pfx", [Convert]::FromBase64String($env:PFX_B64))
          signtool sign /fd SHA256 /f "$env:RUNNER_TEMP\codesign.pfx" /p $env:PFX_PASS /tr http://timestamp.digicert.com /td SHA256 /d "NetFreedom" target/release/netfreedom.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          signtool verify /pa target/release/netfreedom.exe
          Remove-Item "$env:RUNNER_TEMP\codesign.pfx"

      - name: Assemble the package
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          Copy-Item -Recurse dist/windows package
          Copy-Item target/release/netfreedom.exe package/netfreedom.exe
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md, PHILOSOPHY.md, README.md package/
          Remove-Item package/SHA256SUMS.txt -ErrorAction SilentlyContinue
          Push-Location package
          Get-ChildItem -Recurse -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object {
            $rel = (Resolve-Path -Relative $_.FullName).Substring(2) -replace '\\','/'
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $rel
          } | Sort-Object { $_.Substring(66) } | Set-Content -Encoding ascii SHA256SUMS.txt
          Pop-Location
          Compress-Archive -Path package/* -DestinationPath "NetFreedom-$($env:TAG)-windows-x64.zip"

      # Free code signing for open source: apply at https://signpath.org, then add the SignPath
      # action here to sign package/netfreedom.exe BEFORE the checksums are computed.

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release
          path: |
            NetFreedom-${{ github.ref_name }}-windows-x64.zip
            package/netfreedom.exe
            package/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release
      id-token: write       # sign the attestation
      attestations: write   # store the attestation
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            package/netfreedom.exe
            NetFreedom-${{ github.ref_name }}-windows-x64.zip

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes \
            "NetFreedom-${TAG}-windows-x64.zip" package/SHA256SUMS.txt
