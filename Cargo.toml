[package]
name = "netfreedom"
version = "3.0.0"
edition = "2021"
description = "NetFreedom - open, local, reversible tool for reaching the open Internet from Russia: zapret strategies, Cloudflare WARP and game-aware tuning"
license = "GPL-3.0-only"
authors = ["Sergey (PsyGioX) <https://github.com/PsyGioX>"]
repository = "https://github.com/PsyGioX/NetFreedom"
homepage = "https://github.com/PsyGioX/NetFreedom"
readme = "README.md"
keywords = ["zapret", "dpi", "cloudflare-warp", "winws", "nfqws"]
build = "build.rs"

[lib]
name = "nf"
path = "src/lib.rs"

[[bin]]
name = "netfreedom"
path = "src/main.rs"

[dependencies]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_NetworkManagement_IpHelper",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"        # small + fast enough: the launcher is never on the packet path
lto = "fat"
codegen-units = 1
# `unwind`, not `abort`: a panic must be catchable so that the window never just vanishes
# (see `crash::install`), and so that `tune` can survive a failed scenario.
panic = "unwind"
strip = true
debug = false
incremental = false
